<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixelCrush.ai Prototype</title>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Scrollbar Hiding -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #171717; /* Neutral 900 */
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <!-- 1. Load React and ReactDOM from highly stable CDN -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- 2. FIX: Expose React to the global scope as lowercase 'react' BEFORE Lucide loads -->
    <script>window.react = window.React;</script>
    
    <!-- 3. Load Lucide Icons from stable CDN -->
    <script src="https://cdn.jsdelivr.net/npm/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>

    <!-- 4. Load Babel to compile JSX in the browser -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.6/babel.min.js"></script>
</head>
<body class="text-white select-none">
    
    <div id="root"></div>

    <!-- The React App (compiled on the fly) -->
    <script type="text/babel">
        const { useState } = React;
        const { createRoot } = ReactDOM;

        // FIX: Safely grab the Lucide global variable. 
        // If the CDN is blocked by an adblocker or fails, fallback to a proxy that returns empty icons 
        // so the app won't crash with a ReferenceError or white screen!
        const lucideIcons = window.lucideReact || window.LucideReact || new Proxy({}, { get: () => () => null });
        
        const { 
          Heart, MessageCircle, Share2, Sparkles, Home, Search, 
          PlusSquare, User, Gift, ImageIcon, ChevronLeft, Phone, 
          Send, Mic, Video, Settings, ChevronRight, MessageSquare,
          Crown, CheckCircle2, X, Zap, Lock, LogOut, Bell, Shield, 
          CreditCard, HelpCircle, UserCircle, PhoneOff, Volume2, MicOff
        } = lucideIcons;

        function App() {
          // Mock data for AI personas in the Feed
          const profiles = [
            {
              id: 1,
              name: "Lila",
              bio: "Local barista by day, chaotic gamer by night. Let's play Valorant?",
              tags: ["#gamer", "#coffee", "#nightowl"],
              image: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
              likes: "12.4K",
              status: "online"
            },
            {
              id: 2,
              name: "Aria",
              bio: "Always at the beach or at the gym. Looking for someone to motivate me.",
              tags: ["#fitness", "#beach", "#active"],
              image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
              likes: "8.9K",
              status: "offline"
            },
            {
              id: 3,
              name: "Hannah",
              bio: "Bookworm and art history nerd. Tell me your favorite museum.",
              tags: ["#art", "#reading", "#softgirl"],
              image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
              video: "c34fe8eb-9e20-43ce-a418-8a372bae4d23.mp4",
              likes: "15.1K",
              status: "online"
            }
          ];

          // Mock data for the "Your Stories" list
          const storiesList = [
            { id: 's1', name: "Lila", chapters: "1 chapter", time: "3d ago", image: profiles[0].image },
            { id: 's2', name: "Hannah", chapters: "1 chapter", time: "4d ago", image: profiles[2].image },
            { id: 's3', name: "Madison", chapters: "2 chapters", time: "4d ago", image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" },
            { id: 's4', name: "Zoe", chapters: "2 chapters", time: "5d ago", image: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" },
          ];

          // Mock data for the character's chapter list
          const chaptersList = [
            { id: 'c1', title: "Current chapter in progress...", messages: 19, date: "Feb 6", isCurrent: true },
            { id: 'c2', title: "Helped her track down a half-remembered mystery novel", messages: 7, date: "Feb 6", isCurrent: false },
            { id: 'c3', title: "Chance meeting at the bookstore", messages: 5, date: "Feb 6", isCurrent: false },
            { id: 'c4', title: "Chapter 6", messages: 1, date: "Feb 6", isCurrent: false },
            { id: 'c5', title: "Chapter 5", messages: 1, date: "Feb 6", isCurrent: false },
          ];

          // Mock data for the Gallery
          const galleryList = [
            { id: 'g1', type: 'unlocked', img: profiles[0].image, persona: 'Lila', isVideo: true },
            { id: 'g2', type: 'locked', img: profiles[1].image, persona: 'Aria', cost: 50 },
            { id: 'g3', type: 'unlocked', img: profiles[2].image, persona: 'Hannah', isVideo: true },
            { id: 'g4', type: 'locked', img: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=400&q=80', persona: 'Lila', cost: 100 },
            { id: 'g5', type: 'locked', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80', persona: 'Hannah', cost: 75, isVideo: true },
            { id: 'g6', type: 'unlocked', img: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=400&q=80', persona: 'Madison' },
          ];

          const [currentIndex, setCurrentIndex] = useState(0);
          const [liked, setLiked] = useState(false);
          const [view, setView] = useState('feed'); 

          const handleNext = () => {
            setLiked(false);
            setCurrentIndex((prev) => (prev + 1) % profiles.length);
          };

          const currentProfile = profiles[currentIndex];

          // Reusable Bottom Navigation
          const BottomNav = () => (
            <div className="h-16 bg-black border-t border-neutral-800 flex justify-around items-center px-2 z-30 pb-safe shrink-0">
              <button onClick={() => setView('feed')} className={`flex flex-col items-center gap-1 p-2 transition ${view === 'feed' ? 'text-white' : 'text-neutral-500 hover:text-white'}`}>
                <Home size={24} />
                <span className="text-[10px] font-medium">Home</span>
              </button>
              
              <button onClick={() => setView('stories')} className={`flex flex-col items-center gap-1 p-2 transition ${['stories', 'chapters', 'chat'].includes(view) ? 'text-white' : 'text-neutral-500 hover:text-white'}`}>
                <MessageSquare size={24} />
                <span className="text-[10px] font-medium">Chats</span>
              </button>
              
              {/* Prominent Center Action Button - OPENS SUBSCRIPTIONS */}
              <button 
                onClick={() => setView('subscriptions')}
                className={`flex items-center justify-center w-12 h-10 rounded-xl transform -translate-y-2 hover:scale-105 transition shadow-[0_0_15px_rgba(236,72,153,0.5)] ${view === 'subscriptions' ? 'bg-gradient-to-r from-pink-400 to-purple-400 ring-2 ring-white' : 'bg-gradient-to-r from-pink-600 to-purple-600'}`}
              >
                <Crown size={20} className="text-white fill-white" />
              </button>
              
              <button onClick={() => setView('gallery')} className={`flex flex-col items-center gap-1 p-2 transition ${view === 'gallery' ? 'text-white' : 'text-neutral-500 hover:text-white'}`}>
                <ImageIcon size={24} />
                <span className="text-[10px] font-medium">Gallery</span>
              </button>
              <button onClick={() => setView('account')} className={`flex flex-col items-center gap-1 p-2 transition ${view === 'account' ? 'text-white' : 'text-neutral-500 hover:text-white'}`}>
                <User size={24} />
                <span className="text-[10px] font-medium">Account</span>
              </button>
            </div>
          );

          return (
            <div className="flex justify-center items-center h-screen bg-neutral-900 w-full font-sans overflow-hidden touch-none">
              <div className="w-full h-full max-w-md bg-black relative shadow-2xl overflow-hidden flex flex-col">
                
                {view === 'feed' && (
                  <>
                    <div className="absolute top-0 left-0 w-full z-20 flex justify-between items-center p-4 bg-gradient-to-b from-black/80 to-transparent">
                      <div className="flex flex-col">
                        <h1 className="text-2xl font-black italic tracking-tighter">
                          <span className="text-pink-500">PIXEL</span>
                          <span className="text-cyan-400">CRUSH</span>
                          <span className="text-white text-[19px]">.ai</span>
                        </h1>
                      </div>
                      <div onClick={() => setView('subscriptions')} className="flex items-center justify-center bg-neutral-900/80 backdrop-blur-md border border-neutral-700 px-4 py-1.5 rounded-full cursor-pointer hover:bg-neutral-800 transition">
                        <span className="text-white font-bold text-xs tracking-wide">LOGIN / SIGN-UP</span>
                      </div>
                    </div>

                    <div className="absolute top-24 left-4 right-4 z-30 pointer-events-none px-2">
                      <p className="text-white font-bold text-xl text-center leading-snug drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)]">
                        Your AI friend who never forgets and always there to share your experiences.
                      </p>
                    </div>

                    <div className="relative flex-1 bg-neutral-800 cursor-pointer" onClick={handleNext}>
                      {currentProfile.video ? (
                        <video src={currentProfile.video} className="w-full h-full object-cover" autoPlay loop muted playsInline />
                      ) : (
                        <img src={currentProfile.image} alt={currentProfile.name} className="w-full h-full object-cover" />
                      )}
                      
                      <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent pointer-events-none" />

                      <div className="absolute right-4 bottom-20 flex flex-col items-center gap-6 z-20">
                        <div className="relative group cursor-pointer">
                          <div className="w-12 h-12 rounded-full border-2 border-white overflow-hidden">
                            <img src={currentProfile.image} alt="thumb" className="w-full h-full object-cover" />
                          </div>
                          <div className="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-pink-500 rounded-full p-0.5">
                            <PlusSquare size={14} className="text-white" />
                          </div>
                        </div>

                        <button onClick={(e) => { e.stopPropagation(); setLiked(!liked); }} className="flex flex-col items-center gap-1 hover:scale-110 transition-transform">
                          <div className={`p-3 rounded-full bg-black/40 backdrop-blur-sm ${liked ? 'text-red-500' : 'text-white'}`}>
                            <Heart size={28} fill={liked ? "currentColor" : "none"} />
                          </div>
                          <span className="text-white text-xs font-semibold">{currentProfile.likes}</span>
                        </button>

                        <button onClick={(e) => { e.stopPropagation(); setView('chat'); }} className="flex flex-col items-center gap-1 hover:scale-110 transition-transform">
                          <div className="p-3 rounded-full bg-black/40 backdrop-blur-sm text-white">
                            <MessageCircle size={28} />
                          </div>
                          <span className="text-white text-xs font-semibold">Chat</span>
                        </button>

                        <button onClick={(e) => { e.stopPropagation(); setView('voiceCall'); }} className="flex flex-col items-center gap-1 hover:scale-110 transition-transform">
                          <div className="p-3 rounded-full bg-black/40 backdrop-blur-sm text-green-400">
                            <Phone size={28} />
                          </div>
                          <span className="text-white text-xs font-semibold">Voice</span>
                        </button>
                        
                        <button onClick={(e) => e.stopPropagation()} className="flex flex-col items-center gap-1 hover:scale-110 transition-transform">
                          <div className="p-3 rounded-full bg-black/40 backdrop-blur-sm text-white">
                            <Share2 size={28} />
                          </div>
                          <span className="text-white text-xs font-semibold">Share</span>
                        </button>
                      </div>

                      <div className="absolute left-4 bottom-16 right-20 z-20 flex flex-col gap-2 pointer-events-none">
                        <div className="flex items-center gap-3">
                          <h2 className="text-3xl font-bold text-white tracking-wide shadow-black drop-shadow-lg">{currentProfile.name}</h2>
                          {currentProfile.status === 'online' && (
                            <div className="flex items-center gap-1 bg-black/50 backdrop-blur-sm px-2 py-1 rounded-full border border-green-500/30">
                              <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse" />
                              <span className="text-xs text-green-400 font-medium">Online</span>
                            </div>
                          )}
                        </div>
                        <p className="text-white/90 text-sm leading-snug drop-shadow-md">{currentProfile.bio}</p>
                        <div className="flex flex-wrap gap-2 mt-1">
                          {currentProfile.tags.map(tag => (
                            <span key={tag} className="text-xs font-semibold bg-white/20 backdrop-blur-md px-2.5 py-1 rounded-md text-white border border-white/10">{tag}</span>
                          ))}
                        </div>
                      </div>
                    </div>
                    <BottomNav />
                  </>
                )}

                {view === 'stories' && (
                  <div className="flex flex-col h-full w-full bg-[#0a0a0a]">
                    <div className="px-4 py-4 flex justify-between items-center border-b border-white/5 bg-neutral-900/40 backdrop-blur-md">
                      <h1 className="text-xl font-black italic tracking-tighter">
                        <span className="text-pink-500">PIXEL</span>
                        <span className="text-cyan-400">CRUSH</span>
                        <span className="text-white text-[13px]">.ai</span>
                      </h1>
                      <div onClick={() => setView('subscriptions')} className="flex items-center justify-center bg-neutral-900/80 backdrop-blur-md border border-neutral-700 px-4 py-1.5 rounded-full cursor-pointer hover:bg-neutral-800 transition">
                        <span className="text-white font-bold text-xs tracking-wide">LOGIN / SIGN-UP</span>
                      </div>
                    </div>

                    <div className="flex-1 overflow-y-auto pb-4 scrollbar-hide">
                      <h2 className="text-3xl font-bold text-white px-4 pt-6 pb-4">Your Stories</h2>

                      <div className="px-4 pb-6">
                        <div className="bg-[#1a1a1a] rounded-xl flex items-center p-3.5 border border-white/5 focus-within:border-pink-500/50 transition duration-300 shadow-inner">
                          <Search className="text-neutral-500 mr-2" size={18} />
                          <input type="text" placeholder="search stories" className="bg-transparent text-white outline-none w-full text-[15px] placeholder:text-neutral-600" />
                        </div>
                      </div>

                      <div className="px-4 flex flex-col gap-3">
                        {storiesList.map((story) => (
                          <div 
                            key={story.id}
                            onClick={() => setView('chapters')}
                            className="flex items-center p-3.5 rounded-2xl bg-neutral-900/40 backdrop-blur-sm border border-white/5 hover:border-pink-500/30 hover:bg-neutral-800/60 transition-all cursor-pointer group shadow-[0_4px_15px_rgba(0,0,0,0.2)]"
                          >
                            <div className="relative">
                              <img src={story.image} alt={story.name} className="w-14 h-14 rounded-full object-cover group-hover:ring-2 ring-pink-500/50 transition-all duration-300" />
                            </div>
                            <div className="flex-1 ml-4">
                              <h3 className="text-white font-bold text-lg leading-tight">{story.name}</h3>
                              <p className="text-neutral-400 text-[13px] mt-0.5">{story.chapters}</p>
                            </div>
                            <div className="flex flex-col items-end justify-center">
                              <span className="text-neutral-500 text-[11px] font-medium mb-1.5">{story.time}</span>
                              <ChevronRight className="text-neutral-600 group-hover:text-pink-400 transition-colors" size={18} />
                            </div>
                          </div>
                        ))}
                        
                        <div 
                          onClick={() => setView('feed')}
                          className="mt-2 flex flex-col items-center justify-center p-5 rounded-2xl bg-neutral-900/20 border-2 border-dashed border-white/10 hover:border-pink-500/40 hover:bg-neutral-900/60 transition-all cursor-pointer group"
                        >
                          <div className="bg-white/5 group-hover:bg-pink-500/20 p-2.5 rounded-full mb-3 transition-colors">
                            <PlusSquare size={22} className="text-neutral-400 group-hover:text-pink-400 transition-colors" />
                          </div>
                          <h3 className="text-white font-bold text-center text-[15px] mb-1">Start New Chat with a Different Character</h3>
                          <p className="text-neutral-500 text-center text-xs">Browse characters and begin a story</p>
                        </div>

                      </div>
                    </div>
                    <BottomNav />
                  </div>
                )}

                {view === 'chapters' && (
                  <div className="flex flex-col h-full w-full bg-[#0a0a0a]">
                    <div className="px-4 py-4 flex justify-between items-center bg-neutral-900/80 backdrop-blur-md shrink-0">
                      <h1 className="text-xl font-black italic tracking-tighter">
                        <span className="text-pink-500">PIXEL</span>
                        <span className="text-cyan-400">CRUSH</span>
                        <span className="text-white text-[13px]">.ai</span>
                      </h1>
                      <div onClick={() => setView('subscriptions')} className="flex items-center justify-center bg-neutral-900/80 backdrop-blur-md border border-neutral-700 px-4 py-1.5 rounded-full cursor-pointer hover:bg-neutral-800 transition">
                        <span className="text-white font-bold text-xs tracking-wide">LOGIN / SIGN-UP</span>
                      </div>
                    </div>

                    <div className="flex items-center justify-between px-4 py-3 bg-neutral-900/40 border-b border-white/5 backdrop-blur-md shrink-0">
                      <div className="flex items-center gap-3">
                        <button onClick={() => setView('stories')} className="text-white p-1 -ml-2 hover:bg-white/10 rounded-full transition">
                          <ChevronLeft size={28} />
                        </button>
                        <img src={currentProfile.image} alt={currentProfile.name} className="w-10 h-10 rounded-full object-cover border-2 border-pink-500/50" />
                        <div className="flex flex-col">
                          <span className="text-white font-bold text-lg leading-tight">{currentProfile.name}</span>
                          <span className="text-neutral-400 text-xs">Online</span>
                        </div>
                      </div>
                      <button onClick={() => setView('voiceCall')} className="p-2.5 rounded-full bg-black/40 backdrop-blur-sm text-green-400 hover:scale-110 transition-transform border border-white/5">
                        <Phone size={22} />
                      </button>
                    </div>

                    <div className="flex-1 overflow-y-auto px-4 pt-5 pb-6 scrollbar-hide flex flex-col gap-5">
                      <div className="flex gap-3">
                        <button onClick={() => setView('chat')} className="flex-1 py-3.5 bg-gradient-to-r from-pink-500 to-purple-600 rounded-2xl text-white font-bold text-[15px] shadow-[0_4px_15px_rgba(236,72,153,0.3)] hover:scale-[1.02] transition-transform">
                          Continue Story
                        </button>
                        <button className="flex-1 py-3.5 bg-neutral-900/60 border border-white/10 rounded-2xl text-white font-bold text-[15px] hover:bg-neutral-800 transition-colors backdrop-blur-sm">
                          Start New Chapter
                        </button>
                      </div>

                      <div className="bg-[#1a1a1a] rounded-xl flex items-center p-3.5 border border-white/5 focus-within:border-pink-500/50 transition duration-300 shadow-inner">
                        <Search className="text-neutral-500 mr-2" size={18} />
                        <input type="text" placeholder="search chapters" className="bg-transparent text-white outline-none w-full text-[15px] placeholder:text-neutral-600" />
                      </div>

                      <div className="flex flex-col gap-3">
                        {chaptersList.map((chapter) => (
                          <div 
                            key={chapter.id}
                            onClick={() => setView('chat')}
                            className={`flex flex-col p-4 rounded-2xl backdrop-blur-sm cursor-pointer transition-all group shadow-[0_4px_15px_rgba(0,0,0,0.1)]
                              ${chapter.isCurrent 
                                ? 'bg-neutral-900/60 border border-pink-500/50 hover:bg-neutral-800/80' 
                                : 'bg-neutral-900/40 border border-white/5 hover:border-white/20 hover:bg-neutral-800/60'
                              }`}
                          >
                            <h3 className={`font-medium text-[15px] leading-snug mb-3 ${chapter.isCurrent ? 'text-white font-semibold' : 'text-neutral-200'}`}>
                              {chapter.title}
                            </h3>
                            <div className="flex justify-between items-end mt-auto">
                              <div className="flex items-center gap-3">
                                <span className="text-neutral-500 text-[13px]">{chapter.messages} {chapter.messages === 1 ? 'message' : 'messages'}</span>
                                {chapter.isCurrent && (
                                  <span className="bg-pink-500/20 text-pink-400 text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wider">
                                    Current
                                  </span>
                                )}
                              </div>
                              <span className="text-neutral-500 text-[12px] font-medium">{chapter.date}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                    <BottomNav />
                  </div>
                )}

                {view === 'chat' && (
                  <div className="flex flex-col h-full w-full bg-[#111]">
                    <div className="flex items-center justify-between px-4 py-3 bg-neutral-900/90 backdrop-blur-md border-b border-white/5 z-20">
                      <div className="flex items-center gap-3">
                        <button onClick={() => setView('chapters')} className="text-white p-1 -ml-2 hover:bg-white/10 rounded-full transition">
                          <ChevronLeft size={28} />
                        </button>
                        <div className="relative">
                          <img src={currentProfile.image} alt={currentProfile.name} className="w-10 h-10 rounded-full object-cover border-2 border-pink-500/50" />
                        </div>
                        <div className="flex flex-col">
                          <span className="text-white font-bold text-lg leading-tight">{currentProfile.name}</span>
                          <span className="text-neutral-400 text-xs">Online</span>
                        </div>
                      </div>
                      <button onClick={() => setView('voiceCall')} className="p-2.5 rounded-full bg-black/40 backdrop-blur-sm text-green-400 hover:scale-110 transition-transform border border-white/5">
                        <Phone size={22} />
                      </button>
                    </div>

                    <div className="flex-1 overflow-y-auto px-4 py-6 flex flex-col gap-6 scrollbar-hide">
                      <div className="flex flex-col gap-2 max-w-[90%]">
                        <div className="bg-black/60 border border-pink-500/30 backdrop-blur-md text-white p-4 rounded-3xl rounded-tl-sm text-sm leading-relaxed shadow-[0_4px_15px_rgba(236,72,153,0.1)]">
                          <span className="text-pink-400 font-medium italic">*laughs playfully*</span> I can't believe we actually managed to win that last round! You totally saved me at the end there. <span className="text-pink-400 font-medium italic">*takes a sip of coffee, smiling brightly*</span> We should definitely queue up again tomorrow. I'll even buy the coffee next time!
                          <img src={currentProfile.image} alt="Selfie" className="w-full h-64 object-cover rounded-xl mt-3 shadow-md border border-white/5" />
                        </div>
                        
                        <div className="flex items-center gap-2 mt-2">
                          <button className="flex items-center gap-1.5 bg-neutral-900/80 border border-pink-500/40 text-pink-400 px-3 py-1.5 rounded-full text-[11px] font-bold backdrop-blur-md hover:bg-pink-500/10 hover:border-pink-400 transition-all shadow-[0_0_8px_rgba(236,72,153,0.15)]">
                            <Mic size={12} /> Listen
                          </button>
                          <button className="flex items-center gap-1.5 bg-neutral-900/80 border border-pink-500/40 text-pink-400 px-3 py-1.5 rounded-full text-[11px] font-bold backdrop-blur-md hover:bg-pink-500/10 hover:border-pink-400 transition-all shadow-[0_0_8px_rgba(236,72,153,0.15)]">

                        <div className="absolute inset-0 bg-green-500/20 rounded-full animate-ping scale-[1.7]" style={{ animationDuration: '3s' }} />
                        <div className="absolute inset-0 bg-green-500/30 rounded-full animate-ping scale-[1.3]" style={{ animationDuration: '2s', animationDelay: '0.5s' }} />
                        
                        {/* Avatar */}
                        <div className="relative w-40 h-40 rounded-full p-1.5 bg-gradient-to-tr from-green-400 to-emerald-600 shadow-[0_0_50px_rgba(52,211,153,0.3)] z-10">
                          <img 
                            src={currentProfile.image} 
                            alt={currentProfile.name} 
                            className="w-full h-full rounded-full object-cover border-4 border-black" 
                          />
                        </div>
                      </div>

                      <h2 className="text-4xl font-black text-white tracking-tight shadow-black drop-shadow-2xl mb-3">
                        {currentProfile.name}
                      </h2>
                      <div className="flex items-center gap-2 px-4 py-1.5 bg-black/40 backdrop-blur-md rounded-full border border-white/5">
                        <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse" />
                        <span className="text-green-400 font-mono text-lg tracking-widest font-medium">
                          02:14
                        </span>
                      </div>
                    </div>

                    {/* Bottom Controls */}
                    <div className="relative z-10 pb-16 pt-8 px-8 flex justify-center gap-8 items-center">
                      <button className="w-14 h-14 rounded-full bg-white/10 backdrop-blur-xl flex items-center justify-center text-white hover:bg-white/20 transition border border-white/10 shadow-lg">
                        <Volume2 size={24} />
                      </button>
                      
                      <button className="w-14 h-14 rounded-full bg-white/10 backdrop-blur-xl flex items-center justify-center text-white hover:bg-white/20 transition border border-white/10 shadow-lg">
                        <MicOff size={24} />
                      </button>

                      <button 
                        onClick={() => setView('feed')} 
                        className="w-16 h-16 rounded-full bg-red-500 hover:bg-red-600 flex items-center justify-center text-white shadow-[0_0_25px_rgba(239,68,68,0.5)] transition transform hover:scale-105"
                      >
                        <PhoneOff size={28} />
                      </button>
                    </div>
                  </div>
                )}

              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
