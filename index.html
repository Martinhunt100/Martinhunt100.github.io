<!-- =======================================================================
FILE: Account Details.html
Changes applied:
- Removed Birthday field (not needed)
- Removed Connected Accounts block
- Added Save Changes CTA + "unsaved changes" behavior
- Added Delete Account confirmation modal (type-to-confirm)
- Added "Sign-in methods" section (Email / Google / Apple placeholders)
======================================================================= -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Account Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; background-color: #0a0a0a; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script>window.react = window.React;</script>
  <script src="https://cdn.jsdelivr.net/npm/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.6/babel.min.js"></script>
</head>
<body class="text-white select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useMemo, useState } = React;
    const { createRoot } = ReactDOM;

    const lucideIcons = window.lucideReact || window.LucideReact || new Proxy({}, { get: () => () => null });
    const { ChevronLeft, Camera, User, Mail, Trash2, Check, X, ShieldCheck } = lucideIcons;

    function App() {
      const initial = useMemo(() => ({
        username: "GuestUser_992",
        email: "user992@pixelcrush.ai",
      }), []);

      const [form, setForm] = useState({ ...initial });
      const [saved, setSaved] = useState(true);
      const [showDeleteModal, setShowDeleteModal] = useState(false);
      const [deleteConfirm, setDeleteConfirm] = useState("");

      const hasChanges = form.username !== initial.username || form.email !== initial.email;
      const canSave = hasChanges;

      const onChange = (k, v) => {
        setForm(prev => ({ ...prev, [k]: v }));
        setSaved(false);
      };

      const onSave = () => {
        // Prototype: just simulate save
        setSaved(true);
        // In real app: call API, then update initial snapshot / show toast
      };

      const closeDelete = () => {
        setShowDeleteModal(false);
        setDeleteConfirm("");
      };

      const deleteEnabled = deleteConfirm.trim().toUpperCase() === "DELETE";

      return (
        <div className="flex justify-center items-center h-screen bg-neutral-900 w-full font-sans overflow-hidden touch-none">
          <div className="w-full h-full max-w-md bg-[#0a0a0a] relative shadow-2xl flex flex-col">

            {/* Header */}
            <div className="sticky top-0 z-40 px-4 py-4 flex justify-between items-center border-b border-white/5 bg-neutral-900/80 backdrop-blur-xl shrink-0">
              <button onClick={() => window.location.href='index.html'} className="text-white p-2 bg-white/5 rounded-full hover:bg-white/10 transition">
                <ChevronLeft size={24} />
              </button>
              <div className="flex flex-col items-center -mt-0.5">
                <h1 className="text-lg font-bold text-white tracking-wide">Account Details</h1>
                {!saved && (
                  <span className="text-[10px] text-neutral-500 font-semibold tracking-wide">Unsaved changes</span>
                )}
              </div>
              <div className="w-10"></div>
            </div>

            <div className="flex-1 overflow-y-auto pb-24 scrollbar-hide">

              {/* Avatar Section */}
              <div className="flex flex-col items-center py-8">
                <div className="relative group cursor-pointer">
                  <div className="w-28 h-28 rounded-full bg-neutral-800 border-2 border-white/10 overflow-hidden flex items-center justify-center">
                    <User size={48} className="text-neutral-500" />
                  </div>
                  <div className="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                    <Camera size={24} className="text-white" />
                  </div>
                  <div className="absolute bottom-0 right-0 bg-pink-500 p-2 rounded-full border-2 border-[#0a0a0a]">
                    <Camera size={14} className="text-white" />
                  </div>
                </div>
                <p className="text-neutral-500 text-xs mt-3">Tap to change your avatar</p>
              </div>

              {/* Form Fields */}
              <div className="px-4 flex flex-col gap-4">
                <div className="bg-neutral-900/60 rounded-2xl border border-white/5 p-3 flex items-center gap-3">
                  <div className="bg-white/5 p-2 rounded-xl"><User size={18} className="text-neutral-400" /></div>
                  <div className="flex-1">
                    <label className="text-[10px] uppercase tracking-wider text-neutral-500 font-bold block mb-0.5">Username</label>
                    <input
                      type="text"
                      value={form.username}
                      onChange={(e) => onChange("username", e.target.value)}
                      className="w-full bg-transparent text-white text-[15px] font-medium outline-none"
                    />
                  </div>
                </div>

                <div className="bg-neutral-900/60 rounded-2xl border border-white/5 p-3 flex items-center gap-3">
                  <div className="bg-white/5 p-2 rounded-xl"><Mail size={18} className="text-neutral-400" /></div>
                  <div className="flex-1">
                    <label className="text-[10px] uppercase tracking-wider text-neutral-500 font-bold block mb-0.5">Email</label>
                    <input
                      type="email"
                      value={form.email}
                      onChange={(e) => onChange("email", e.target.value)}
                      className="w-full bg-transparent text-white text-[15px] font-medium outline-none"
                    />
                  </div>
                </div>
              </div>

              {/* Sign-in methods */}
              <div className="px-4 mt-8">
                <h3 className="text-sm font-bold text-neutral-500 uppercase tracking-wider mb-3 px-2">Sign-in Methods</h3>
                <div className="bg-neutral-900/40 rounded-3xl border border-white/5 overflow-hidden">
                  <div className="flex items-center justify-between p-4 border-b border-white/5">
                    <div className="flex items-center gap-3">
                      <div className="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center">
                        <Mail size={18} className="text-neutral-300" />
                      </div>
                      <div>
                        <p className="text-white font-medium text-[15px]">Email</p>
                        <p className="text-neutral-500 text-xs">{form.email}</p>
                      </div>
                    </div>
                    <span className="text-emerald-400 text-xs font-bold flex items-center gap-1">
                      <ShieldCheck size={14} /> Active
                    </span>
                  </div>

                  <div className="flex items-center justify-between p-4 border-b border-white/5">
                    <div className="flex items-center gap-3">
                      <div className="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center">
                        <span className="text-white font-black">G</span>
                      </div>
                      <div>
                        <p className="text-white font-medium text-[15px]">Google</p>
                        <p className="text-neutral-500 text-xs">Connect for one-tap sign-in</p>
                      </div>
                    </div>
                    <button className="text-pink-400 text-sm font-bold hover:text-pink-300 transition">Connect</button>
                  </div>

                  <div className="flex items-center justify-between p-4">
                    <div className="flex items-center gap-3">
                      <div className="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center">
                        <span className="text-white font-black"></span>
                      </div>
                      <div>
                        <p className="text-white font-medium text-[15px]">Apple</p>
                        <p className="text-neutral-500 text-xs">Connect for one-tap sign-in</p>
                      </div>
                    </div>
                    <button className="text-pink-400 text-sm font-bold hover:text-pink-300 transition">Connect</button>
                  </div>
                </div>
              </div>

              {/* Danger Zone */}
              <div className="px-4 mt-10">
                <button
                  onClick={() => setShowDeleteModal(true)}
                  className="w-full flex items-center justify-center gap-2 py-4 rounded-2xl bg-red-500/10 text-red-500 font-bold hover:bg-red-500/20 transition-colors border border-red-500/20"
                >
                  <Trash2 size={18} /> Delete Account
                </button>
                <p className="text-center text-neutral-600 text-xs mt-3">This action cannot be undone.</p>
              </div>
            </div>

            {/* Sticky Save Bar */}
            <div className="absolute bottom-0 left-0 right-0 bg-neutral-950/90 backdrop-blur-xl border-t border-white/5 p-4">
              <button
                onClick={onSave}
                disabled={!canSave}
                className={`w-full flex items-center justify-center gap-2 py-3.5 rounded-2xl font-bold transition
                  ${canSave
                    ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white hover:scale-[1.01]'
                    : 'bg-white/10 text-neutral-500 cursor-not-allowed'
                  }`}
              >
                <Check size={18} /> Save Changes
              </button>
            </div>

            {/* Delete Modal */}
            {showDeleteModal && (
              <div className="absolute inset-0 z-50 flex items-end">
                <div className="absolute inset-0 bg-black/70" onClick={closeDelete} />
                <div className="relative w-full rounded-t-3xl bg-neutral-950 border-t border-white/10 p-5">
                  <div className="flex items-start justify-between">
                    <div>
                      <h3 className="text-white font-black text-xl">Delete account</h3>
                      <p className="text-neutral-400 text-sm mt-1">This removes your account and associated data.</p>
                    </div>
                    <button onClick={closeDelete} className="p-2 rounded-full bg-white/5 hover:bg-white/10 transition">
                      <X size={18} className="text-white" />
                    </button>
                  </div>

                  <div className="mt-4 bg-red-500/10 border border-red-500/20 rounded-2xl p-4">
                    <p className="text-red-200 text-sm leading-relaxed">
                      Type <span className="font-black">DELETE</span> to confirm.
                    </p>
                    <input
                      value={deleteConfirm}
                      onChange={(e) => setDeleteConfirm(e.target.value)}
                      placeholder="Type DELETE"
                      className="mt-3 w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-white outline-none"
                    />
                  </div>

                  <button
                    disabled={!deleteEnabled}
                    className={`mt-4 w-full py-3.5 rounded-2xl font-bold transition
                      ${deleteEnabled ? 'bg-red-600 text-white hover:bg-red-500' : 'bg-white/10 text-neutral-500 cursor-not-allowed'}`}
                  >
                    Permanently Delete
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Notifications</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; background-color: #0a0a0a; }

  </style>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>

<body class="text-white select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const { createRoot } = ReactDOM;

    const lucideIcons = window.lucideReact || window.LucideReact || new Proxy({}, { get: () => () => null });
    const { ChevronLeft, Bell, Sparkles, MessageSquare, Shield, Clock, CreditCard } = lucideIcons;

    const Toggle = ({ enabled, onChange }) => (
      <button
        onClick={onChange}
        className={`w-14 h-8 rounded-full p-1 transition flex items-center ${enabled ? 'bg-pink-500/80' : 'bg-white/10'}`}
      >
        <div className={`w-6 h-6 rounded-full bg-white transition transform ${enabled ? 'translate-x-6' : 'translate-x-0'}`} />
      </button>
    );

    const Row = ({ icon, title, desc, enabled, setEnabled }) => (
      <div className="flex items-center justify-between p-4 border-b border-white/5">
        <div className="flex items-start gap-3">
          <div className="w-10 h-10 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center">
            {icon}
          </div>
          <div>
            <p className="text-white font-semibold">{title}</p>

          </div>
        </div>
        <Toggle enabled={enabled} onChange={() => setEnabled(!enabled)} />
      </div>
    );

      const [messageNotifs, setMessageNotifs] = useState(true);
      const [newFeatures, setNewFeatures] = useState(true);
      const [security, setSecurity] = useState(true);
      const [promos, setPromos] = useState(false);

      const [usageAlerts, setUsageAlerts] = useState(true);
      const [billingAlerts, setBillingAlerts] = useState(true);

      const [quietMode, setQuietMode] = useState(false);

      return (
        <div className="flex justify-center items-center h-screen bg-neutral-900 w-full font-sans overflow-hidden touch-none">
          <div className="w-full h-full max-w-md bg-[#0a0a0a] relative shadow-2xl flex flex-col">

            <div className="sticky top-0 z-40 px-4 py-4 flex justify-between items-center border-b border-white/5 bg-neutral-900/80 backdrop-blur-xl shrink-0">
              <button onClick={() => window.location.href='index.html'} className="text-white p-2 bg-white/5 rounded-full hover:bg-white/10 transition">
                <ChevronLeft size={24} />
              </button>
              <h1 className="text-lg font-bold text-white tracking-wide">Notifications</h1>
              <div className="w-10"></div>
            </div>

            <div className="flex-1 overflow-y-auto pb-10 scrollbar-hide">

              <div className="px-5 pt-8 pb-4">
                <div className="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center mb-4 border border-white/5">
                  <Bell size={24} className="text-white" />
                </div>
                <h2 className="text-3xl font-black text-white mb-2 tracking-tight">Stay in the loop</h2>
                <p className="text-neutral-500 text-sm">Control what we notify you about.</p>
              </div>

              {/* Quick quiet mode card */}
              <div className="px-4 mb-6">
                <div className="bg-neutral-900/40 border border-white/10 rounded-3xl p-5 flex items-center justify-between">
                  <div className="flex items-start gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center">
                      <Clock size={20} className="text-neutral-200" />
                    </div>
                    <div>
                      <p className="text-white font-bold">Quiet Mode</p>
                      <p className="text-neutral-500 text-xs mt-0.5">
                        Pause non-critical notifications.
                      </p>
                      <p className="text-neutral-600 text-[11px] mt-1">
                        Critical security and billing alerts may still be sent.
                      </p>
                    </div>
                  </div>
                  <Toggle enabled={quietMode} onChange={() => setQuietMode(!quietMode)} />
                </div>
              </div>

              {/* Notification toggles */}
              <div className="px-4">
                <h3 className="text-sm font-bold text-neutral-500 uppercase tracking-wider mb-3 px-2">Preferences</h3>
                <div className="bg-neutral-900/40 rounded-3xl border border-white/5 overflow-hidden">

                  <Row
                    icon={<MessageSquare size={18} className="text-pink-400" />}
                    title="Messages"
                    desc="New replies and chat activity."
                    enabled={messageNotifs}
                    setEnabled={setMessageNotifs}
                  />

                  <Row
                    icon={<Sparkles size={18} className="text-purple-400" />}
                    title="New Features"
                    desc="Product improvements and releases."
                    enabled={newFeatures}
                    setEnabled={setNewFeatures}
                  />

                  <Row
                    icon={<Shield size={18} className="text-green-400" />}
                    title="Security"
                    desc="Login alerts and account security changes."
                    enabled={security}
                    setEnabled={setSecurity}
                  />

                  <Row
                    icon={<Bell size={18} className="text-neutral-300" />}
                    title="Promos & Updates"
                    desc="Plan updates and product announcements."
                    enabled={promos}
                    setEnabled={setPromos}
                  />

                </div>
              </div>

              {/* Important alerts */}
              <div className="px-4 mt-6">
                <h3 className="text-sm font-bold text-neutral-500 uppercase tracking-wider mb-3 px-2">Important alerts</h3>
                <div className="bg-neutral-900/40 rounded-3xl border border-white/5 overflow-hidden">

                  <Row
                    icon={<Sparkles size={18} className="text-yellow-300" />}
                    title="Usage Alerts"
                    desc="When you’re nearing monthly limits."
                    enabled={usageAlerts}
                    setEnabled={setUsageAlerts}
                  />

                  <Row
                    icon={<CreditCard size={18} className="text-yellow-400" />}
                    title="Billing Alerts"
                    desc="Renewals, payment failures, and receipts."
                    enabled={billingAlerts}
                    setEnabled={setBillingAlerts}
                  />

                </div>
              </div>

              <div className="h-8" />
            </div>

          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>


<!-- =======================================================================
FILE: Privacy & Safety.html
Changes applied per your instructions:
- Removed “Blur media” / “Incognito” / “Help Improve AI” sections entirely
- Added consent modal shown immediately after sign-up (matches your screenshot)
- Added SFW policy card (recommended D)
- Consent toggles persist on the page after modal is dismissed
======================================================================= -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Privacy & Safety</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; background-color: #0a0a0a; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script>window.react = window.React;</script>
  <script src="https://cdn.jsdelivr.net/npm/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.6/babel.min.js"></script>
</head>
<body class="text-white select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const { createRoot } = ReactDOM;

    const lucideIcons = window.lucideReact || window.LucideReact || new Proxy({}, { get: () => () => null });
    const { ChevronLeft, ShieldCheck, AlertTriangle, X } = lucideIcons;

    const Toggle = ({ enabled, onChange, disabled }) => (
      <button
        onClick={() => !disabled && onChange(!enabled)}
        className={`w-16 h-9 rounded-full p-1 transition flex items-center
          ${disabled ? 'bg-white/5 cursor-not-allowed' : enabled ? 'bg-pink-500/80' : 'bg-white/10'}`}
        aria-label="toggle"
      >
        <div className={`w-7 h-7 rounded-full bg-white transition transform ${enabled ? 'translate-x-7' : 'translate-x-0'}`} />
      </button>
    );

    const ConsentCard = ({ title, badge, required, enabled, setEnabled, children, warning }) => (
      <div className="bg-neutral-900/40 border border-white/10 rounded-3xl p-5 backdrop-blur-sm">
        <div className="flex items-start justify-between gap-4">
          <div className="min-w-0">
            <div className="flex items-baseline gap-2 flex-wrap">
              <h3 className="text-white font-black text-xl tracking-tight">{title}</h3>
              <span className="text-white/80 text-sm font-semibold">{badge}</span>
            </div>
          </div>
          <Toggle enabled={enabled} onChange={setEnabled} disabled={required} />
        </div>

        <p className="text-neutral-200 text-sm leading-relaxed mt-4">
          {children}
        </p>

        {warning && (
          <div className="mt-4 flex items-start gap-3 text-neutral-200">
            <AlertTriangle size={16} className="text-yellow-300 mt-0.5 shrink-0" />
            <p className="text-sm">{warning}</p>
          </div>
        )}
      </div>
    );

    function App() {
      // Consent states
      const [platformService, setPlatformService] = useState(true); // required, always true
      const [helpImprove, setHelpImprove] = useState(false);
      const [aiLicensing, setAiLicensing] = useState(false);

      // Modal shown after sign-up (prototype default true)
      const [showModal, setShowModal] = useState(true);

      const closeModal = () => {
        // Platform service must be true
        if (!platformService) return;
        setShowModal(false);
      };

      return (
        <div className="flex justify-center items-center h-screen bg-neutral-900 w-full font-sans overflow-hidden touch-none">
          <div className="w-full h-full max-w-md bg-[#0a0a0a] relative shadow-2xl flex flex-col">

            <div className="sticky top-0 z-40 px-4 py-4 flex justify-between items-center border-b border-white/5 bg-neutral-900/80 backdrop-blur-xl shrink-0">
              <button onClick={() => window.location.href='index.html'} className="text-white p-2 bg-white/5 rounded-full hover:bg-white/10 transition">
                <ChevronLeft size={24} />
              </button>
              <h1 className="text-lg font-bold text-white tracking-wide">Privacy & Safety</h1>
              <div className="w-10"></div>
            </div>

            <div className="flex-1 overflow-y-auto pb-10 scrollbar-hide">
              {/* SFW policy card (recommended D) */}
              <div className="px-4 pt-6">
                <div className="bg-emerald-500/10 border border-emerald-400/20 rounded-3xl p-5">
                  <div className="flex items-start gap-3">
                    <ShieldCheck size={18} className="text-emerald-300 mt-0.5 shrink-0" />
                    <div>
                      <p className="text-white font-bold text-[15px]">Strictly SFW service</p>
                      <p className="text-neutral-200 text-sm mt-1 leading-relaxed">
                        PixelCrush is a strictly SFW AI companion product. Explicit sexual content is not supported.
                        Some requests may be refused to keep the experience safe.
                      </p>
                    </div>
                  </div>
                </div>
              </div>

              {/* Consent settings (same content as modal, available anytime) */}
              <div className="px-4 mt-6 flex flex-col gap-4">
                <ConsentCard
                  title="Platform Service"
                  badge="Required"
                  required={true}
                  enabled={platformService}
                  setEnabled={setPlatformService}
                >
                  I consent to PixelCrush processing my conversation data, voice data, and generated images to provide the AI companion service. This includes storing my conversations, analyzing emotional content to improve responses, and generating personalized images.
                </ConsentCard>

                <ConsentCard
                  title="Help Improve PixelCrush AI"
                  badge="Optional"
                  required={false}
                  enabled={helpImprove}
                  setEnabled={setHelpImprove}
                >
                  I consent to PixelCrush using my anonymized interaction patterns to improve our AI systems. This helps us make conversations more natural and responsive. You can use the full service without this consent.
                </ConsentCard>

                <ConsentCard
                  title="AI Research Data Licensing"
                  badge="Optional"
                  required={false}
                  enabled={aiLicensing}
                  setEnabled={setAiLicensing}
                  warning="Once data is licensed, it cannot be recalled from recipients even if you later withdraw consent."
                >
