<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>PixelCrush.ai Prototype (SFW)</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #171717;
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script>window.react = window.React;</script>
  <script src="https://cdn.jsdelivr.net/npm/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.6/babel.min.js"></script>
</head>
<body class="text-white select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const { createRoot } = ReactDOM;

    const lucideIcons = window.lucideReact || window.LucideReact || new Proxy({}, { get: () => () => null });

    const {
      Heart, MessageCircle, Share2, Sparkles, Home, Search,
      PlusSquare, User, ImageIcon, ChevronLeft, Phone,
      Send, Mic, Video, Settings, ChevronRight, MessageSquare,
      Crown, CheckCircle2, X, Zap, Lock, LogOut, Bell, Shield,
      CreditCard, HelpCircle, UserCircle, PhoneOff, Volume2, MicOff,
      ShieldCheck, Clock3, BarChart3
    } = lucideIcons;

    // ----------------------------
    // Plans aligned to attached spreadsheet
    // ----------------------------
    const PLAN_CONFIG = {
      Starter: {
        key: "Starter",
        name: "Starter (post-onboarding)",
        price: 0,
        accent: "neutral",
        allowances: { messages: 1500, images: 25, videos: 0, voiceMins: 10, ttsChars: 4000 },
        cta: "Select Plan",
        featured: false,
      },
      Core: {
        key: "Core",
        name: "Core",
        price: 14.99,
        accent: "pink",
        allowances: { messages: 5000, images: 200, videos: 0, voiceMins: 30, ttsChars: 20000 },
        cta: "Select Plan",
        featured: false,
      },
      Premium: {
        key: "Premium",
        name: "Premium",
        price: 39.99,
        accent: "purple",
        allowances: { messages: 10000, images: 500, videos: 5, voiceMins: 90, ttsChars: 50000 },
        cta: "Upgrade Now",
        featured: true,
      },
      Ultra: {
        key: "Ultra",
        name: "Ultra",
        price: 89.99,
        accent: "yellow",
        allowances: { messages: 20000, images: 1000, videos: 10, voiceMins: 150, ttsChars: 100000 },
        cta: "Select Plan",
        featured: false,
      }
    };

    const PLAN_ORDER = ["Starter", "Core", "Premium", "Ultra"];
    const tierRank = { Starter: 0, Core: 1, Premium: 2, Ultra: 3 };

    function formatNumber(n) {
      return n.toLocaleString();
    }

    function pct(used, total) {
      if (!total || total <= 0) return 0;
      return Math.min(100, Math.round((used / total) * 100));
    }

    function App() {
      const profiles = [
        {
          id: 1,
          name: "Lila",
          bio: "Local barista by day, chaotic gamer by night. Want to queue up for a few rounds?",
          tags: ["#gamer", "#coffee", "#nightowl"],
          image: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
          likes: "12.4K",
          status: "online"
        },
        {
          id: 2,
          name: "Aria",
          bio: "Always at the beach or at the gym. Looking for a motivating chat buddy.",
          tags: ["#fitness", "#beach", "#active"],
          image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
          likes: "8.9K",
          status: "offline"
        },
        {
          id: 3,
          name: "Hannah",
          bio: "Bookworm and art history nerd. Tell me your favorite museum.",
          tags: ["#art", "#reading", "#softgirl"],
          image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
          video: "c34fe8eb-9e20-43ce-a418-8a372bae4d23.mp4",
          likes: "15.1K",
          status: "online"
        }
      ];

      const storiesList = [
        { id: 's1', name: "Lila", chapters: "1 chapter", time: "3d ago", image: profiles[0].image },
        { id: 's2', name: "Hannah", chapters: "1 chapter", time: "4d ago", image: profiles[2].image },
        { id: 's3', name: "Madison", chapters: "2 chapters", time: "4d ago", image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" },
        { id: 's4', name: "Zoe", chapters: "2 chapters", time: "5d ago", image: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" },
      ];

      const chaptersList = [
        { id: 'c1', title: "Current chapter in progress...", messages: 19, date: "Feb 6", isCurrent: true },
        { id: 'c2', title: "Helped her track down a half-remembered mystery novel", messages: 7, date: "Feb 6", isCurrent: false },
        { id: 'c3', title: "Chance meeting at the bookstore", messages: 5, date: "Feb 6", isCurrent: false },
        { id: 'c4', title: "Chapter 6", messages: 1, date: "Feb 6", isCurrent: false },
        { id: 'c5', title: "Chapter 5", messages: 1, date: "Feb 6", isCurrent: false },
      ];

      // Gallery gating uses plan access / limits (no tokens)
      const galleryList = [
        { id: 'g1', type: 'unlocked', img: profiles[0].image, persona: 'Lila', isVideo: true },
        { id: 'g2', type: 'locked', img: profiles[1].image, persona: 'Aria', requiredTier: 'Core', lockReason: 'Plan required' },
        { id: 'g3', type: 'unlocked', img: profiles[2].image, persona: 'Hannah', isVideo: true },
        { id: 'g4', type: 'locked', img: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=400&q=80', persona: 'Lila', requiredTier: 'Premium', lockReason: 'Plan required' },
        { id: 'g5', type: 'locked', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80', persona: 'Hannah', isVideo: true, lockReason: 'Monthly video limit reached' },
        { id: 'g6', type: 'unlocked', img: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=400&q=80', persona: 'Madison' },
      ];

      // Mock logged-in state for prototype
      const [currentPlan, setCurrentPlan] = useState("Premium");
      const [renewalDate] = useState("Mar 12");
      const [voiceDailyCap] = useState(10);
      const [voiceDailyUsed] = useState(3);

      const [usage] = useState({
        messages: 8240,
        images: 120,
        videos: 4,
        voiceMins: 45,
        ttsChars: 18200
      });

      const [currentIndex, setCurrentIndex] = useState(0);
      const [liked, setLiked] = useState(false);
      const [view, setView] = useState('feed');

      const currentProfile = profiles[currentIndex];
      const planMeta = PLAN_CONFIG[currentPlan];

      const handleNext = () => {
        setLiked(false);
        setCurrentIndex((prev) => (prev + 1) % profiles.length);
      };

      const canAccessTier = (requiredTier) => {
        if (!requiredTier) return true;
        return tierRank[currentPlan] >= tierRank[requiredTier];
      };

      const AuthPill = () => (
        <div
          onClick={() => setView('plans')}
          className="flex items-center justify-center bg-neutral-900/80 backdrop-blur-md border border-neutral-700 px-4 py-1.5 rounded-full cursor-pointer hover:bg-neutral-800 transition"
        >
          <span className="text-white font-bold text-xs tracking-wide">LOGIN / SIGN-UP</span>
        </div>
      );

      const BottomNav = () => (
        <div className="h-16 bg-black border-t border-neutral-800 flex justify-around items-center px-2 z-30 shrink-0">
          <button onClick={() => setView('feed')} className={`flex flex-col items-center gap-1 p-2 transition ${view === 'feed' ? 'text-white' : 'text-neutral-500 hover:text-white'}`}>
            <Home size={24} />
            <span className="text-[10px] font-medium">Home</span>
          </button>

          <button onClick={() => setView('stories')} className={`flex flex-col items-center gap-1 p-2 transition ${['stories', 'chapters', 'chat'].includes(view) ? 'text-white' : 'text-neutral-500 hover:text-white'}`}>
            <MessageSquare size={24} />
            <span className="text-[10px] font-medium">Chats</span>
          </button>

          <button
            onClick={() => setView('plans')}
            className={`flex flex-col items-center justify-center w-14 h-12 rounded-xl transform -translate-y-2 hover:scale-105 transition shadow-[0_0_15px_rgba(236,72,153,0.5)] ${view === 'plans' ? 'bg-gradient-to-r from-pink-400 to-purple-400 ring-2 ring-white' : 'bg-gradient-to-r from-pink-600 to-purple-600'}`}
          >
            <Crown size={18} className="text-white fill-white" />
            <span className="text-[9px] font-bold mt-0.5 text-white">Plans</span>
          </button>

          <button onClick={() => setView('gallery')} className={`flex flex-col items-center gap-1 p-2 transition ${view === 'gallery' ? 'text-white' : 'text-neutral-500 hover:text-white'}`}>
            <ImageIcon size={24} />
            <span className="text-[10px] font-medium">Gallery</span>
          </button>
          <button onClick={() => setView('account')} className={`flex flex-col items-center gap-1 p-2 transition ${view === 'account' ? 'text-white' : 'text-neutral-500 hover:text-white'}`}>
            <User size={24} />
            <span className="text-[10px] font-medium">Account</span>
          </button>
        </div>
      );

      const ProgressRow = ({ label, used, total, compact = false }) => {
        const width = pct(used, total);
        return (
          <div>
            <div className={`flex justify-between ${compact ? 'text-[11px]' : 'text-xs'} mb-1.5`}>
              <span className="text-neutral-400">{label}</span>
              <span className="text-white font-medium">{formatNumber(used)} / {formatNumber(total)}</span>
            </div>
            <div className="w-full bg-black/50 rounded-full h-2 overflow-hidden border border-white/5">
              <div className="bg-gradient-to-r from-pink-500 to-purple-500 h-2 rounded-full" style={{ width: `${width}%` }}></div>
            </div>
          </div>
        );
      };

      const PlansPage = () => (
        <div className="flex flex-col h-full w-full bg-[#0a0a0a]">
          <div className="sticky top-0 z-40 px-4 py-4 flex justify-between items-center border-b border-white/5 bg-neutral-900/80 backdrop-blur-xl shrink-0">
            <button onClick={() => setView('feed')} className="text-neutral-400 hover:text-white transition bg-white/5 p-2 rounded-full">
              <X size={20} />
            </button>
            <h1 className="text-lg font-bold text-white tracking-wide">Plans & Usage</h1>
            <div className="w-9" />
          </div>

          <div className="flex-1 overflow-y-auto px-4 pt-5 pb-8 scrollbar-hide flex flex-col gap-6">

            {/* SFW banner */}
            <div className="bg-emerald-500/10 border border-emerald-400/20 rounded-2xl p-4 backdrop-blur-sm">
              <div className="flex items-start gap-3">
                <ShieldCheck size={18} className="text-emerald-400 mt-0.5 shrink-0" />
                <div>
                  <p className="text-white font-semibold text-sm">Strictly SFW companion service</p>
                  <p className="text-neutral-300 text-xs mt-1 leading-relaxed">
                    PixelCrush is a subscription-based AI companion product. Explicit sexual content is not supported.
                  </p>
                </div>
              </div>
            </div>

            {/* Usage policy (kept), middle current-plan box removed */}
            <div className="bg-neutral-900/40 border border-white/10 rounded-3xl p-5 backdrop-blur-sm">
              <div className="flex items-center gap-2 mb-3">
                <Clock3 size={16} className="text-cyan-400" />
                <h3 className="text-white font-bold text-sm">Usage policy</h3>
              </div>
              <ul className="text-xs text-neutral-300 leading-relaxed space-y-2">
                <li>• Monthly allowances reset on your billing date.</li>
                <li>• Voice calls also use a daily safety cap to prevent overuse.</li>
                <li>• When you hit a limit, you can upgrade or wait for your reset.</li>
                <li>• Optional one-off video packs may be offered later if enabled.</li>
              </ul>
            </div>

            {/* Plans */}
            <div>
              <div className="flex items-center gap-2 mb-3">
                <BarChart3 size={16} className="text-pink-400" />
                <h3 className="text-white font-bold text-sm">Choose a plan</h3>
              </div>
              <p className="text-neutral-400 text-xs mb-4">
                Choose a monthly plan for chat, images, voice calls, and more.
              </p>

              <div className="flex flex-col gap-4">
                {PLAN_ORDER.map((tierKey) => {
                  const tier = PLAN_CONFIG[tierKey];
                  const isCurrent = currentPlan === tierKey;

                  const cardBase = "rounded-3xl p-5 backdrop-blur-sm relative overflow-hidden transition-all";
                  let cardClasses = "bg-neutral-900/40 border border-white/10";
                  let titleClass = "text-white";
                  let btnClass = "bg-white/10 text-white hover:bg-white/20";

                  if (tier.accent === "pink") {
                    cardClasses = "bg-neutral-900/40 border border-pink-500/30 hover:border-pink-500/60";
                    titleClass = "text-pink-400";
                    btnClass = "bg-pink-500/10 text-pink-400 border border-pink-500/30 hover:bg-pink-500/20";
                  }
                  if (tier.accent === "purple") {
                    cardClasses = "bg-gradient-to-br from-neutral-900 to-neutral-900 border border-purple-500/60 shadow-[0_0_30px_rgba(168,85,247,0.15)]";
                    titleClass = "text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400";
                    btnClass = "bg-gradient-to-r from-pink-600 to-purple-600 text-white shadow-[0_4px_15px_rgba(236,72,153,0.25)] hover:scale-[1.02]";
                  }
                  if (tier.accent === "yellow") {
                    cardClasses = "bg-neutral-900/40 border border-yellow-500/30 hover:border-yellow-500/60";
                    titleClass = "text-yellow-500";
                    btnClass = "bg-yellow-500/10 text-yellow-500 border border-yellow-500/30 hover:bg-yellow-500/20";
                  }

                  return (
                    <div key={tierKey} className={`${cardBase} ${cardClasses} ${tier.featured ? 'scale-[1.01]' : ''}`}>
                      {tier.featured && (
                        <>
                          <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-pink-500 to-purple-600" />
                          <div className="absolute top-4 right-4 bg-gradient-to-r from-pink-500 to-purple-600 text-[10px] font-bold text-white px-2.5 py-1 rounded-full uppercase tracking-wider">
                            Most Popular
                          </div>
                        </>
                      )}

                      <div className={`flex justify-between items-center ${tier.featured ? 'mt-2' : ''} mb-4`}>
                        <h3 className={`text-xl font-bold ${titleClass}`}>{tier.name}</h3>
                        <span className="text-lg font-black text-white">
                          ${tier.price}
                          <span className="text-sm font-medium text-neutral-500">/mo</span>
                        </span>
                      </div>

                      <ul className="flex flex-col gap-3 mb-5 text-sm">
                        <li className="flex items-center gap-3 text-white"><CheckCircle2 size={16} className="text-pink-500" /> {formatNumber(tier.allowances.messages)} Messages</li>
                        <li className="flex items-center gap-3 text-white"><CheckCircle2 size={16} className="text-pink-500" /> {formatNumber(tier.allowances.images)} Images</li>
                        <li className="flex items-center gap-3 text-white"><CheckCircle2 size={16} className="text-pink-500" /> {formatNumber(tier.allowances.videos)} Video Moments</li>
                        <li className="flex items-center gap-3 text-white"><CheckCircle2 size={16} className="text-pink-500" /> {formatNumber(tier.allowances.voiceMins)} Voice Mins</li>
                        <li className="flex items-center gap-3 text-white"><CheckCircle2 size={16} className="text-pink-500" /> {formatNumber(tier.allowances.ttsChars)} TTS Chars</li>
                      </ul>

                      <button
                        onClick={() => setCurrentPlan(tierKey)}
                        className={`w-full py-3 rounded-xl font-bold transition-colors ${btnClass} ${tier.featured ? 'transition-transform' : ''}`}
                      >
                        {isCurrent && tierKey !== "Starter" ? "Current Plan" : tier.cta}
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          <BottomNav />
        </div>
      );

      return (
        <div className="flex justify-center items-center h-screen bg-neutral-900 w-full font-sans overflow-hidden">
          <div className="w-full h-full max-w-md bg-black relative shadow-2xl overflow-hidden flex flex-col">

            {view === 'feed' && (
              <>
                <div className="absolute top-0 left-0 w-full z-20 flex justify-between items-center p-4 bg-gradient-to-b from-black/80 to-transparent">
                  <div className="flex flex-col">
                    <h1 className="text-2xl font-black italic tracking-tighter">
                      <span className="text-pink-500">PIXEL</span>
                      <span className="text-cyan-400">CRUSH</span>
                      <span className="text-white text-[19px]">.ai</span>
                    </h1>
                  </div>
                  <AuthPill />
                </div>

                <div className="absolute top-24 left-4 right-4 z-30 pointer-events-none px-2">
                  <p className="text-white font-bold text-xl text-center leading-snug drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)]">
                    Meet your new AI friend, always there to share experiences
                  </p>
                </div>

                <div className="relative flex-1 bg-neutral-800 cursor-pointer" onClick={handleNext}>
                  {currentProfile.video ? (
                    <video src={currentProfile.video} className="w-full h-full object-cover" autoPlay loop muted playsInline />
                  ) : (
                    <img src={currentProfile.image} alt={currentProfile.name} className="w-full h-full object-cover" />
                  )}

                  <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent pointer-events-none" />

                  <div className="absolute right-4 bottom-20 flex flex-col items-center gap-6 z-20">
                    <div className="relative group cursor-pointer">
                      <div className="w-12 h-12 rounded-full border-2 border-white overflow-hidden">
                        <img src={currentProfile.image} alt="thumb" className="w-full h-full object-cover" />
                      </div>
                      <div className="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-pink-500 rounded-full p-0.5">
                        <PlusSquare size={14} className="text-white" />
                      </div>
                    </div>

                    <button onClick={(e) => { e.stopPropagation(); setLiked(!liked); }} className="flex flex-col items-center gap-1 hover:scale-110 transition-transform">
                      <div className={`p-3 rounded-full bg-black/40 backdrop-blur-sm ${liked ? 'text-red-500' : 'text-white'}`}>
                        <Heart size={28} fill={liked ? "currentColor" : "none"} />
                      </div>
                      <span className="text-white text-xs font-semibold">{currentProfile.likes}</span>
                    </button>

                    <button onClick={(e) => { e.stopPropagation(); setView('chat'); }} className="flex flex-col items-center gap-1 hover:scale-110 transition-transform">
                      <div className="p-3 rounded-full bg-black/40 backdrop-blur-sm text-white">
                        <MessageCircle size={28} />
                      </div>
                      <span className="text-white text-xs font-semibold">Chat</span>
                    </button>

                    <button onClick={(e) => { e.stopPropagation(); setView('voiceCall'); }} className="flex flex-col items-center gap-1 hover:scale-110 transition-transform">
                      <div className="p-3 rounded-full bg-black/40 backdrop-blur-sm text-green-400">
                        <Phone size={28} />
                      </div>
                      <span className="text-white text-xs font-semibold">Voice</span>
                    </button>

                    <button onClick={(e) => e.stopPropagation()} className="flex flex-col items-center gap-1 hover:scale-110 transition-transform">
                      <div className="p-3 rounded-full bg-black/40 backdrop-blur-sm text-white">
                        <Share2 size={28} />
                      </div>
                      <span className="text-white text-xs font-semibold">Share</span>
                    </button>
                  </div>

                  <div className="absolute left-4 bottom-16 right-20 z-20 flex flex-col gap-2 pointer-events-none">
                    <div className="flex items-center gap-3">
                      <h2 className="text-3xl font-bold text-white tracking-wide shadow-black drop-shadow-lg">{currentProfile.name}</h2>
                      {currentProfile.status === 'online' && (
                        <div className="flex items-center gap-1 bg-black/50 backdrop-blur-sm px-2 py-1 rounded-full border border-green-500/30">
                          <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse" />
                          <span className="text-xs text-green-400 font-medium">Online</span>
                        </div>
                      )}
                    </div>
                    <p className="text-white/90 text-sm leading-snug drop-shadow-md">{currentProfile.bio}</p>
                    <div className="flex flex-wrap gap-2 mt-1">
                      {currentProfile.tags.map(tag => (
                        <span key={tag} className="text-xs font-semibold bg-white/20 backdrop-blur-md px-2.5 py-1 rounded-md text-white border border-white/10">{tag}</span>
                      ))}
                    </div>
                  </div>
                </div>
                <BottomNav />
              </>
            )}

            {view === 'stories' && (
              <div className="flex flex-col h-full w-full bg-[#0a0a0a]">
                <div className="px-4 py-4 flex justify-between items-center border-b border-white/5 bg-neutral-900/40 backdrop-blur-md">
                  <h1 className="text-xl font-black italic tracking-tighter">
                    <span className="text-pink-500">PIXEL</span>
                    <span className="text-cyan-400">CRUSH</span>
                    <span className="text-white text-[13px]">.ai</span>
                  </h1>
                  <AuthPill />
                </div>

                <div className="flex-1 overflow-y-auto pb-4 scrollbar-hide">
                  <h2 className="text-3xl font-bold text-white px-4 pt-6 pb-4">Your Stories</h2>

                  <div className="px-4 pb-4">
                    <div className="bg-[#1a1a1a] rounded-xl flex items-center p-3.5 border border-white/5">
                      <Search className="text-neutral-500 mr-2" size={18} />
                      <input type="text" placeholder="search stories" className="bg-transparent text-white outline-none w-full text-[15px] placeholder:text-neutral-600" />
                    </div>
                  </div>

                  <div className="px-4 flex flex-col gap-3">
                    {storiesList.map((story) => (
                      <div
                        key={story.id}
                        onClick={() => setView('chapters')}
                        className="flex items-center p-3.5 rounded-2xl bg-neutral-900/40 backdrop-blur-sm border border-white/5 hover:border-pink-500/30 hover:bg-neutral-800/60 transition-all cursor-pointer group"
                      >
                        <img src={story.image} alt={story.name} className="w-14 h-14 rounded-full object-cover group-hover:ring-2 ring-pink-500/50 transition-all duration-300" />
                        <div className="flex-1 ml-4">
                          <h3 className="text-white font-bold text-lg leading-tight">{story.name}</h3>
                          <p className="text-neutral-400 text-[13px] mt-0.5">{story.chapters}</p>
                        </div>
                        <div className="flex flex-col items-end justify-center">
                          <span className="text-neutral-500 text-[11px] font-medium mb-1.5">{story.time}</span>
                          <ChevronRight className="text-neutral-600 group-hover:text-pink-400 transition-colors" size={18} />
                        </div>
                      </div>
                    ))}

                  <button className="w-14 h-14 rounded-full bg-white/10 backdrop-blur-xl flex items-center justify-center text-white hover:bg-white/20 transition border border-white/10">
                    <Volume2 size={24} />
                  </button>

                  <button className="w-14 h-14 rounded-full bg-white/10 backdrop-blur-xl flex items-center justify-center text-white hover:bg-white/20 transition border border-white/10">
                    <MicOff size={24} />
                  </button>

                  <button
                    onClick={() => setView('feed')}
                    className="w-16 h-16 rounded-full bg-red-500 hover:bg-red-600 flex items-center justify-center text-white shadow-[0_0_25px_rgba(239,68,68,0.5)] transition transform hover:scale-105"
                  >
                    <PhoneOff size={28} />
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
