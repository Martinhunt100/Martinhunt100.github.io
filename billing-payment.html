<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Billing & Payment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; background-color: #0a0a0a; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script>window.react = window.React;</script>
  <script src="https://cdn.jsdelivr.net/npm/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.6/babel.min.js"></script>
</head>

<body class="text-white select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { createRoot } = ReactDOM;

    const lucideIcons = window.lucideReact || window.LucideReact || new Proxy({}, { get: () => () => null });
    const { ChevronLeft, CreditCard, Crown, Calendar, Mail, Plus, Receipt, Lock } = lucideIcons;

    function App() {
      return (
        <div className="flex justify-center items-center h-screen bg-neutral-900 w-full font-sans overflow-hidden touch-none">
          <div className="w-full h-full max-w-md bg-[#0a0a0a] relative shadow-2xl flex flex-col">

            <div className="sticky top-0 z-40 px-4 py-4 flex justify-between items-center border-b border-white/5 bg-neutral-900/80 backdrop-blur-xl shrink-0">
              <button onClick={() => window.location.href='index.html'} className="text-white p-2 bg-white/5 rounded-full hover:bg-white/10 transition" aria-label="Back">
                <ChevronLeft size={24} />
              </button>
              <h1 className="text-lg font-bold text-white tracking-wide">Billing & Payment</h1>
              <div className="w-10"></div>
            </div>

            <div className="flex-1 overflow-y-auto pb-10 scrollbar-hide">
              <div className="px-5 pt-8 pb-4">
                <div className="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center mb-4 border border-white/5">
                  <CreditCard size={24} className="text-white" />
                </div>
                <h2 className="text-3xl font-black text-white mb-2 tracking-tight">Your subscription</h2>
                <p className="text-neutral-500 text-sm">Manage your plan and payment methods.</p>
              </div>

              {/* Plan */}
              <div className="px-4">
                <div className="bg-neutral-900/50 border border-white/10 rounded-3xl p-5 relative overflow-hidden">
                  <div className="absolute -right-10 -top-10 w-32 h-32 bg-purple-600/10 rounded-full blur-2xl pointer-events-none" />
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <Crown size={18} className="text-pink-400" />
                      <p className="text-white font-bold text-lg">Premium Plan</p>
                    </div>
                    <span className="text-white font-black text-lg">$39.99<span className="text-neutral-500 text-sm font-semibold">/mo</span></span>
                  </div>

                  <div className="mt-3 flex items-center gap-2 text-xs text-neutral-400">
                    <Calendar size={14} />
                    <span>Renews on Mar 12</span>
                    <span className="text-neutral-600">•</span>
                    <span>Allowances reset on renewal date</span>
                  </div>

                  <button className="mt-4 w-full py-3 rounded-2xl font-bold bg-gradient-to-r from-pink-500 to-purple-600 text-white hover:scale-[1.01] transition">
                    Manage Plan
                  </button>
                </div>
              </div>

              {/* Billing email */}
              <div className="px-4 mt-6">
                <h3 className="text-sm font-bold text-neutral-500 uppercase tracking-wider mb-3 px-2">Billing email</h3>
                <div className="bg-neutral-900/40 rounded-3xl border border-white/5 p-4 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center">
                      <Mail size={18} className="text-neutral-200" />
                    </div>
                    <div>
                      <p className="text-white font-semibold">user992@pixelcrush.ai</p>
                      <p className="text-neutral-500 text-xs">Receipts and renewal notices</p>
                    </div>
                  </div>
                  <button className="text-pink-400 font-bold text-sm hover:text-pink-300 transition">Edit</button>
                </div>
              </div>

              {/* Payment methods */}
              <div className="px-4 mt-6">
                <h3 className="text-sm font-bold text-neutral-500 uppercase tracking-wider mb-3 px-2">Payment methods</h3>

                <div className="bg-neutral-900/40 rounded-3xl border border-white/5 overflow-hidden">
                  <div className="flex items-center justify-between p-4 border-b border-white/5">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center">
                        <CreditCard size={18} className="text-neutral-200" />
                      </div>
                      <div>
                        <p className="text-white font-semibold">Visa •••• 4242</p>
                        <p className="text-neutral-500 text-xs">Default</p>
                      </div>
                    </div>
                    <button className="text-neutral-300 text-sm font-bold hover:text-white transition">Edit</button>
                  </div>

                  <div className="flex items-center justify-between p-4">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center">
                        <Lock size={18} className="text-neutral-200" />
                      </div>
                      <div>
                        <p className="text-white font-semibold">Apple Pay</p>
                        <p className="text-neutral-500 text-xs">Coming soon</p>
                      </div>
                    </div>
                    <button className="text-neutral-600 text-sm font-bold cursor-not-allowed">Unavailable</button>
                  </div>
                </div>

                <button className="mt-4 w-full py-3 rounded-2xl font-bold bg-white/5 border border-white/10 text-white hover:bg-white/10 transition flex items-center justify-center gap-2">
                  <Plus size={18} /> Add payment method
                </button>
              </div>

              {/* Billing history */}
              <div className="px-4 mt-8">
                <h3 className="text-sm font-bold text-neutral-500 uppercase tracking-wider mb-3 px-2">Billing history</h3>
                <div className="bg-neutral-900/40 rounded-3xl border border-white/5 overflow-hidden">
                  {[
                    { date: "Feb 12, 2026", amount: "$39.99", status: "Paid" },
                    { date: "Jan 12, 2026", amount: "$39.99", status: "Paid" },
                    { date: "Dec 12, 2025", amount: "$39.99", status: "Paid" },
                  ].map((r, idx) => (
                    <div key={idx} className={`flex items-center justify-between p-4 ${idx !== 2 ? 'border-b border-white/5' : ''}`}>
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center">
                          <Receipt size={18} className="text-neutral-200" />
                        </div>
                        <div>
                          <p className="text-white font-semibold">{r.date}</p>
                          <p className="text-neutral-500 text-xs">{r.status}</p>
                        </div>
                      </div>
                      <span className="text-white font-black">{r.amount}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="h-8" />
            </div>

          </div>
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
